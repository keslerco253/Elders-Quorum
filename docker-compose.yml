# On Windows, use INSTALL.bat / UPDATE.bat: they keep the settings file and
# backups in %USERPROFILE%\EldersQuorumApp (EQ_ENV_FILE / EQ_BACKUP_DIR), so a new
# version can be unzipped into any folder.
# Elsewhere:  docker compose up -d --build   (uses .env and ./backups here)
name: elders-quorum
services:
  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:-}
    restart: unless-stopped
    env_file: ${EQ_ENV_FILE:-.env}
    environment:
      - BACKUP_DIR=/backups
    ports:
      # Change APP_PORT in .env if something else on this computer uses 3000.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      # The live database stays inside Docker (more reliable for SQLite on Windows).
      - eqdata:/data
      # Nightly backups go to the backups folder (see the top of this file).
      - type: bind
        source: ${EQ_BACKUP_DIR:-./backups}
        target: /backups
        bind:
          create_host_path: true

  # Optional: only if you use Cloudflare Tunnel with your own domain instead of
  # Tailscale Funnel. Start with: docker compose --profile cloudflare up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  eqdata:
    name: elders-quorum-data
